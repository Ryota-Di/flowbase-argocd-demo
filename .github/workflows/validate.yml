name: Validate FlowBase manifests
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'scenarios/**'
      - 'kind-config.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  helm-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyyaml>=6,<7'
      - name: App source and JavaScript checks
        run: |
          python tests/app_smoke.py
          node --check app/v1/main.js
          node --check app/v2/main.js
      - name: Build both images in CI (no registry push on PR)
        run: |
          docker build --build-arg APP_VARIANT=v1 -t flowbase-web:test-v1 .
          docker build --build-arg APP_VARIANT=v2 -t flowbase-web:test-v2 .
      - name: Configuration, PR-flow and RBAC checks
        run: |
          python tests/static_checks.py
          python tests/git_flow_checks.py
          python tests/manifest_checks.py
          python tests/checkpoints_checks.py
      - name: Render and lint
        run: |
          helm lint charts/flowbase-web -f charts/flowbase-web/values-staging.yaml
          helm lint charts/flowbase-web -f charts/flowbase-web/values-prod.yaml
          python tests/render_checks.py
