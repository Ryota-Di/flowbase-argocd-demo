name: Validate GitOps deployment configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyyaml>=6,<7'
      - name: Helm render / local-only pull policy checks
        run: |
          helm lint charts/flowbase-web -f charts/flowbase-web/values-staging.yaml
          helm lint charts/flowbase-web -f charts/flowbase-web/values-prod.yaml
          python tests/gitops_checks.py
          python tests/showcase_checks.py
