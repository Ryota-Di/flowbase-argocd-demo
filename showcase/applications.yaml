# 18 ConfigMap-only simulated apps: 9 services x 2 environments; original Checkout apps remain untouched.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowbase-auth-prod
  namespace: argocd
  labels:
    flowbase.example/showcase: 'true'
    flowbase.example/service: auth
    flowbase.example/environment: prod
    flowbase.example/team: team-platform
    app.kubernetes.io/part-of: flowbase
  annotations:
    flowbase.example/purpose: ConfigMap-only portfolio simulation; no running workloads
spec:
  project: flowbase
  source:
    repoURL: https://github.com/Ryota-Di/flowbase-argocd-demo.git
    targetRevision: main
    path: showcase/chart
    helm:
      parameters:
      - name: service
        value: auth
      - name: environment
        value: prod
      - name: team
        value: team-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: flowbase-prod
  syncPolicy: {}
---
